# Keep the Vercel serverless backend warm (Hobby has no 5-min crons).
name: Health checkpoint

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit backend health
        env:
          HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
        run: |
          # Fallback = current production backend (avoids stale/missing secrets)
          URL="${HEALTH_URL:-https://truck-weather-route-backend.vercel.app/api/health/}"
          echo "Pinging $URL"
          ok=0
          for i in 1 2 3; do
            code=$(curl -sS -m 45 -o /tmp/health.json -w "%{http_code}" "$URL" || echo "000")
            echo "Attempt $i → HTTP $code"
            cat /tmp/health.json 2>/dev/null || true
            echo
            if [ "$code" = "200" ]; then
              ok=1
              break
            fi
            sleep $((i * 5))
          done
          test "$ok" = "1"
