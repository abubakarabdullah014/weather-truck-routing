# Free fallback keepalive if Vercel Hobby can't run 5-minute crons.
# Pings BACKEND_HEALTH_URL every 5 minutes.
name: Health checkpoint

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit backend health
        env:
          HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "Set repo secret BACKEND_HEALTH_URL (e.g. https://api.example.com/api/health/)"
            exit 1
          fi
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "$HEALTH_URL")
          echo "HTTP $code"
          cat /tmp/health.json
          test "$code" = "200"
